                  <circle cx="32" cy="32" r="24.5"/>
          </clipPath>
    </defs>
    <g clip-path="url(#inner)">
          <rect x="7" y="7" width="50" height="50" fill="#65A8D8"/>
          <circle cx="44" cy="17" r="7" fill="#E9B33B"/>
          <!-- Sierra peaks -->
          <path d="M6 31 L17 20 L23 27 L31 14 L39 25 L45 19 L58 32 L58 38 L6 38 Z" fill="#245B86"/>
