<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
    <title id="title">Sierra High Mushrooms favicon</title>
    <desc id="desc">A simplified mushroom, Sierra mountain peak, pine trees, and sun inside a circular badge.</desc>
    <circle cx="32" cy="32" r="30" fill="#0B3D2E"/>
    <circle cx="32" cy="32" r="26.5" fill="#F6F1E5"/>
    <defs>
